services:
  agent-redis:
    container_name: smarthub-agent-redis
    image: redis/redis-stack-server:7.4.0-v8
    volumes:
      - agent-redis-data:/data
    ports:
      - "6380:6379"

  etcd:
    container_name: smarthub-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd:/etcd

  minio:
    container_name: smarthub-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - milvus-minio:/minio_data

  milvus-standalone:
    container_name: smarthub-milvus
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  agent-service:
    container_name: smarthub-agent-service
    build:
      context: ./agent-service
    env_file:
      - path: ./agent-service/.env
        required: false
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      REDIS_URL: redis://agent-redis:6379/0
      KNOWLEDGE_DIR: /knowledge/customer-service
    volumes:
      - ./knowledge/customer-service:/knowledge/customer-service:ro
    ports:
      - "8000:8000"
    depends_on:
      - milvus-standalone
      - agent-redis

  knowledge-indexer:
    profiles: ["ingest"]
    build:
      context: ./agent-service
    env_file:
      - path: ./agent-service/.env
        required: false
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      REDIS_URL: redis://agent-redis:6379/0
      KNOWLEDGE_DIR: /knowledge/customer-service
    volumes:
      - ./knowledge/customer-service:/knowledge/customer-service:ro
    command: ["python", "-m", "app.rag.ingest"]
    depends_on:
      - milvus-standalone

volumes:
  agent-redis-data:
  milvus-etcd:
  milvus-minio:
  milvus-data:
